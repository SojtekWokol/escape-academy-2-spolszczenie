# Release of the Polish translation: push a tag "v1.0.0" (made after "Wydaj wersję 1.0.0" in the
# workshop, which writes translations/releases/1.0.0.json) and GitHub builds the players' installer
# from that release and attaches it to a GitHub Release. No game files are needed for this.
#
# The workshop code (Rust workspace) lives in the repository named in the repository variable
# WARSZTAT_REPO (e.g. "owner/warsztat"); leave it unset if the code is in this repository under rust/.
name: Wydanie

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Wersja do zbudowania (np. 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  instalator:
    # vars.RUNNER = "ea2-pc" sends the job to the own runner; unset = GitHub's machines
    runs-on: ${{ vars.RUNNER || 'windows-latest' }}
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Tłumaczenie (to repozytorium)
        uses: actions/checkout@v4
        with:
          path: tlumaczenie

      - name: Kod warsztatu
        if: ${{ vars.WARSZTAT_REPO != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.WARSZTAT_REPO }}
          path: warsztat

      - name: Ścieżki
        shell: powershell
        run: |
          $rust = if (Test-Path warsztat) { "warsztat" } else { "tlumaczenie/rust" }
          "RUST_DIR=$rust" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "EA2_TRANSLATIONS=$env:GITHUB_WORKSPACE/tlumaczenie/translations" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "EA2_FONTS=$env:GITHUB_WORKSPACE/tlumaczenie/fonts" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "EA2_RELEASE=$($env:VERSION -replace '^v', '')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # the own runner (vars.RUNNER) already has Rust; these two are for GitHub's machines
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !vars.RUNNER }}

      - uses: Swatinem/rust-cache@v2
        if: ${{ !vars.RUNNER }}
        with:
          workspaces: ${{ env.RUST_DIR }}

      - name: Budowa instalatora
        shell: powershell
        run: |
          Set-Location $env:RUST_DIR
          cargo build --release -p instalator
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/out" | Out-Null
          Copy-Item target/release/ea2-spolszczenie.exe "$env:GITHUB_WORKSPACE/out/EA2-Spolszczenie-$env:EA2_RELEASE.exe"

      # the texts alone, for installed copies that update themselves (fixed name, so
      # releases/latest/download/tlumaczenie.json always points at the newest one)
      - name: Plik aktualizacji
        shell: powershell
        run: |
          $src = "$env:EA2_TRANSLATIONS/releases/$env:EA2_RELEASE.json"
          Copy-Item $src "$env:GITHUB_WORKSPACE/out/tlumaczenie.json"
          (Get-FileHash "$env:GITHUB_WORKSPACE/out/tlumaczenie.json" -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii -NoNewline "$env:GITHUB_WORKSPACE/out/tlumaczenie.json.sha256"

      - name: Wydanie na GitHubie
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.EA2_RELEASE }}
          name: Spolszczenie Escape Academy 2 – ${{ env.EA2_RELEASE }}
          files: |
            out/EA2-Spolszczenie-${{ env.EA2_RELEASE }}.exe
            out/tlumaczenie.json
            out/tlumaczenie.json.sha256
          body: |
            Nieoficjalne polskie tłumaczenie Escape Academy 2.

            1. Pobierz **EA2-Spolszczenie-${{ env.EA2_RELEASE }}.exe** i uruchom (gra musi być zamknięta).
            2. Kliknij **Zainstaluj**.
            3. W grze wybierz w ustawieniach język **POLSKI**.

            Przycisk **Przywróć wersję oryginalną** w tym samym programie cofa zmiany.

            Masz już spolszczenie? Instalator i skrót „Escape Academy 2 (PL)” same zaproponują aktualizację.
